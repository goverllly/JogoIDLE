<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sinergia IDLE — Galeria da Fama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/sinergia-idle/styles.css" />
    <link rel="stylesheet" href="/sinergia-idle/hud.css" />
    <link rel="stylesheet" href="/sinergia-idle/theme-ref.css" />
    <link rel="stylesheet" href="/sinergia-idle/galeria.css" />
  </head>
  <body class="galeria-page">
    <div class="play-stage galeria-shell">
      <header class="galeria-header panel-frame">
        <div class="galeria-header__brand">
          <p class="galeria-eyebrow">Sinergia IDLE</p>
          <h1>Galeria da Fama</h1>
          <p class="galeria-lede">Grandes feitos forjados nas sombras.</p>
        </div>
        <nav class="galeria-nav" aria-label="Navegação">
          <a class="galeria-nav__link" href="/sinergia-idle/lobby.html">Lobby</a>
          <a class="galeria-nav__link" href="/sinergia-idle/play.html">Jogar</a>
        </nav>
      </header>

      <p id="galeria-scope" class="galeria-scope" role="status" hidden></p>

      <div class="galeria-tabs" role="tablist">
        <button type="button" class="galeria-tab is-active" data-tab="journey" role="tab" aria-selected="true">
          Minha Jornada
        </button>
        <button type="button" class="galeria-tab" data-tab="fame" role="tab" aria-selected="false">
          Galeria da Fama
        </button>
        <button type="button" class="galeria-tab is-soon" data-tab="chronicles" role="tab" aria-selected="false" disabled title="Em breve">
          Crônicas — em breve
        </button>
      </div>

      <main id="galeria-main" class="galeria-main">
        <section id="panel-journey" class="galeria-panel" data-panel="journey">
          <div class="galeria-toolbar">
            <label>
              Período
              <select id="journey-period">
                <option value="lifetime">Histórico vitalício</option>
                <option value="season">Temporada atual</option>
                <option value="year">Ano atual</option>
                <option value="last30d">Últimos 30 dias</option>
              </select>
            </label>
            <label class="galeria-privacy">
              <input type="checkbox" id="journey-privacy" />
              Ocultar meu nome nos rankings públicos
            </label>
          </div>
          <p id="journey-banner" class="galeria-banner" hidden></p>
          <div id="journey-loading" class="galeria-state">Carregando sua jornada…</div>
          <div id="journey-empty" class="galeria-state" hidden>Nenhuma estatística ainda. Vá caçar.</div>
          <div id="journey-error" class="galeria-state galeria-state--err" hidden></div>
          <div id="journey-content" class="galeria-content" hidden></div>
        </section>

        <section id="panel-fame" class="galeria-panel" data-panel="fame" hidden>
          <div id="fame-loading" class="galeria-state">Consultando os salões…</div>
          <div id="fame-error" class="galeria-state galeria-state--err" hidden></div>
          <div id="fame-content" class="galeria-content" hidden>
            <div class="galeria-hero panel-frame">
              <img class="galeria-hero__bg" src="/sinergia-idle/assets/hud/ranking-hall-bg.svg" alt="" />
              <h2>A Guerra Nunca Termina</h2>
              <div id="fame-globals" class="galeria-globals"></div>
            </div>
            <h3 class="galeria-section-title">
              <img src="/sinergia-idle/assets/hud/ranking-crown.svg" alt="" width="28" height="28" />
              Hall dos Recordes
            </h3>
            <div id="fame-hall" class="galeria-hall"></div>
            <h3 class="galeria-section-title">Rankings por categoria</h3>
            <div class="galeria-toolbar">
              <label>
                Categoria
                <select id="fame-category"></select>
              </label>
              <button type="button" class="galeria-btn" id="fame-rank-prev">Anterior</button>
              <button type="button" class="galeria-btn" id="fame-rank-next">Próxima</button>
            </div>
            <div id="fame-ranking" class="galeria-ranking"></div>
            <h3 class="galeria-section-title">Comparar aventureiros</h3>
            <div class="galeria-toolbar galeria-compare-form">
              <input id="compare-a" type="text" placeholder="ID personagem A" />
              <span>vs</span>
              <input id="compare-b" type="text" placeholder="ID personagem B" />
              <button type="button" class="galeria-btn galeria-btn--gold" id="compare-go">Comparar</button>
            </div>
            <div id="fame-compare" class="galeria-compare"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/sinergia-idle/galeria.js"></script>
  </body>
</html>
