<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lobby — Jogo IDLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/jogo-idle/styles/hud.css" />
    <link rel="stylesheet" href="/jogo-idle/lobby.css" />
    <link rel="stylesheet" href="/jogo-idle/styles/hall-frame.css" />
  </head>
  <body class="lobby-page">
    <div class="lobby-bg" aria-hidden="true"></div>
    <div class="lobby-shell">
      <header class="lobby-topbar">
        <p class="lobby-brand">Jogo IDLE</p>
        <nav class="lobby-tabs" aria-label="Navegação">
          <a class="is-on" href="/jogo-idle/lobby.html">Jogar</a>
          <a href="/jogo-idle/cronicas.html">Crônicas</a>
          <a href="/jogo-idle/admin/">Admin</a>
        </nav>
        <div class="lobby-seal" aria-hidden="true"></div>
      </header>

      <div class="idle-lobby-grid">
        <section class="hall-frame idle-lobby-panel idle-lobby-preview">
          <div class="idle-lobby-panel-head">
            <h2 class="hall-title idle-lobby-panel-title">Salão da classe</h2>
          </div>
          <div class="idle-lobby-preview__stage">
            <iframe
              id="preview-frame"
              title="Prévia do personagem"
              src="/jogo-idle/preview.html?hall=1"
              allow="autoplay"
            ></iframe>
            <span class="idle-lobby-preview__hint">Arraste para girar · Roda para zoom</span>
          </div>
          <span class="hall-frame__bl" aria-hidden="true"></span>
          <span class="hall-frame__br" aria-hidden="true"></span>
        </section>

        <section class="hall-frame idle-lobby-panel idle-lobby-hall is-empty" id="hero-hall">
          <div class="idle-lobby-panel-head">
            <div>
              <h2 class="hall-title idle-lobby-panel-title">Seus personagens</h2>
              <p class="idle-lobby-panel-desc" id="slots-label">0/3 slots</p>
            </div>
          </div>
          <div class="idle-lobby-hall__body">
          <div class="idle-slot-grid" id="char-list">
            <p class="lobby-status" id="lobby-status">Abrindo o salão…</p>
          </div>

          <section class="idle-lobby-side-card" id="detail-panel" hidden>
            <div class="idle-detail-head">
              <div>
                <h3 id="detail-name">—</h3>
                <p id="detail-meta">—</p>
              </div>
              <div class="idle-detail-actions">
                <button type="button" class="hall-btn hall-btn--gold idle-btn idle-btn-play" id="btn-play">Jogar</button>
                <button type="button" class="hall-btn hall-btn--danger idle-btn idle-btn-delete" id="btn-delete">Excluir</button>
              </div>
            </div>
            <div class="idle-lobby-panel__body">
              <div class="idle-attr-grid" id="attr-grid"></div>
              <div class="idle-stat-grid" id="bag-equip-grid"></div>
              <div class="idle-stat-grid" id="hpmp-grid"></div>
              <div class="idle-gold-bar">
                <span class="idle-gold-bar__label" aria-hidden="true">◉</span>
                <p class="idle-gold-bar__label">Ouro</p>
                <p class="idle-gold-bar__value" id="detail-gold">0</p>
              </div>
              <p class="lobby-err" id="detail-err" hidden></p>
            </div>
          </section>
          </div>
          <span class="hall-frame__bl" aria-hidden="true"></span>
          <span class="hall-frame__br" aria-hidden="true"></span>
        </section>
      </div>

      <section class="hall-frame idle-lobby-create" id="create-panel">
        <div class="idle-lobby-panel-head">
          <div>
            <h2 class="hall-title idle-lobby-panel-title">Novo personagem</h2>
            <p class="idle-lobby-panel-desc">Escolha a classe. Cores, capa e elmo ficam definitivos no estúdio.</p>
          </div>
        </div>
        <div class="class-rail" id="class-rail"></div>
        <a class="hall-btn hall-btn--gold idle-btn idle-btn-create" id="btn-studio" href="/jogo-idle/criar.html">
          Abrir Estúdio de Criação
        </a>
        <p class="lobby-err" id="create-err" hidden></p>
        <span class="hall-frame__bl" aria-hidden="true"></span>
        <span class="hall-frame__br" aria-hidden="true"></span>
      </section>
    </div>

    <div class="lobby-confirm" id="delete-confirm" hidden>
      <div class="lobby-confirm__backdrop" data-act="cancel"></div>
      <section
        class="hall-frame lobby-confirm__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-confirm-title"
        aria-describedby="delete-confirm-msg"
      >
        <div class="idle-lobby-panel-head">
          <h2 class="hall-title idle-lobby-panel-title" id="delete-confirm-title">Excluir personagem</h2>
        </div>
        <p class="lobby-confirm__msg" id="delete-confirm-msg"></p>
        <p class="lobby-confirm__meta" id="delete-confirm-meta"></p>
        <div class="lobby-confirm__actions">
          <button type="button" class="hall-btn hall-btn--ghost" data-act="cancel">Cancelar</button>
          <button type="button" class="hall-btn hall-btn--danger" data-act="ok" id="delete-confirm-ok">Excluir</button>
        </div>
        <span class="hall-frame__bl" aria-hidden="true"></span>
        <span class="hall-frame__br" aria-hidden="true"></span>
      </section>
    </div>

    <script type="module">
      import { applyCsrfHeaders, rejectIfFailed } from "./http.js";
      import { CLASS_HALLS } from "./class-halls.js";
      const CLASS_ICON = {
        GUERREIRO: "/jogo-idle/assets/classes/guerreiro.png",
        BARBARO: "/jogo-idle/assets/classes/barbaro.png",
        MAGO: "/jogo-idle/assets/classes/mago.png",
        ARQUEIRO: "/jogo-idle/assets/classes/arqueiro.png",
      };

      const DEFAULT_APPEARANCE = {
        helmet: false,
        cape: true,
        skin: "fair",
        armor: "steel",
        metal: "gold",
        capeColor: "crimson",
        scale: 1,
        stance: "Idle",
      };

      const state = {
        characters: [],
        classes: [],
        maxCharacters: 3,
        selectedId: null,
      };

      const els = {
        list: document.getElementById("char-list"),
        slots: document.getElementById("slots-label"),
        detail: document.getElementById("detail-panel"),
        detailName: document.getElementById("detail-name"),
        detailMeta: document.getElementById("detail-meta"),
        attrGrid: document.getElementById("attr-grid"),
        bagEquip: document.getElementById("bag-equip-grid"),
        hpmp: document.getElementById("hpmp-grid"),
        gold: document.getElementById("detail-gold"),
        detailErr: document.getElementById("detail-err"),
        create: document.getElementById("create-panel"),
        btnStudio: document.getElementById("btn-studio"),
        createErr: document.getElementById("create-err"),
        btnPlay: document.getElementById("btn-play"),
        btnDelete: document.getElementById("btn-delete"),
        frame: document.getElementById("preview-frame"),
        hall: document.getElementById("hero-hall"),
        status: document.getElementById("lobby-status"),
      };

      function fmt(n) {
        if (n === "—" || n == null || n === "") return "—";
        const v = Number(n);
        if (!Number.isFinite(v)) return String(n);
        return v.toLocaleString("pt-BR");
      }

      function resolveAppearance(raw) {
        if (!raw || typeof raw !== "object") return { ...DEFAULT_APPEARANCE };
        return { ...DEFAULT_APPEARANCE, ...raw };
      }

      function classLabel(id) {
        const found = state.classes.find((c) => c.id === id);
        return found?.name || id || "—";
      }

      function pushPreview(classId, appearance) {
        const win = els.frame?.contentWindow;
        if (!win || !classId) return;
        win.postMessage(
          { type: "jogo-idle:preview", classId, appearance: { ...appearance } },
          window.location.origin,
        );
      }

      function pingPreview() {
        els.frame?.contentWindow?.postMessage(
          { type: "jogo-idle:preview-ping" },
          window.location.origin,
        );
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.data?.type === "jogo-idle:preview-ready") syncPreviewFromSelection();
      });

      els.frame?.addEventListener("load", () => {
        pingPreview();
        syncPreviewFromSelection();
      });

      function selectedCharacter() {
        return state.characters.find((c) => c.id === state.selectedId) || null;
      }

      function syncPreviewFromSelection() {
        const sel = selectedCharacter();
        if (sel) pushPreview(sel.classId, resolveAppearance(sel.appearance));
      }

      function setErr(el, msg) {
        if (!msg) {
          el.hidden = true;
          el.textContent = "";
          return;
        }
        el.hidden = false;
        el.textContent = msg;
      }

      function ascentLabel(character) {
        if (character.ascension) return String(character.ascension);
        if (character.classification && character.classification !== "MORTAL") return String(character.classification);
        return "";
      }

      function renderList() {
        const max = state.maxCharacters || 3;
        els.slots.textContent = `${state.characters.length}/${max} slots`;
        els.hall?.classList.toggle("is-empty", state.characters.length === 0);
        if (els.status) els.status.hidden = true;

        const cards = [];
        for (let i = 0; i < max; i += 1) {
          const c = state.characters[i];
          if (!c) {
            const first = state.characters.length === 0 && i === 0;
            const open = state.characters.length < max;
            const hint = first
              ? "Abra o estúdio para começar a jornada."
              : "Você ainda pode criar outro personagem.";
            const tag = open ? "a" : "div";
            const href = open ? ' href="/jogo-idle/criar.html"' : "";
            cards.push(`
              <${tag} class="idle-slot idle-slot--empty"${href}>
                <span class="idle-slot__mark" aria-hidden="true">+</span>
                <span class="idle-slot__title">Espaço disponível</span>
                <span class="idle-slot__hint">${hint}</span>
              </${tag}>`);
            continue;
          }
          const active = c.id === state.selectedId;
          const icon = CLASS_ICON[c.classId];
          const avatar = icon
            ? `<img src="${icon}" alt="" />`
            : "◆";
          const farm = c.farmZoneId ? `<span class="idle-char-card__badge">Em farm</span>` : "";
          const ascent = ascentLabel(c);
          const ascentHtml = ascent ? `<span class="idle-char-card__ascent">${escapeHtml(ascent)}</span>` : "";
          cards.push(`
            <button type="button" class="idle-char-card idle-slot${active ? " idle-char-card--active" : ""}" data-id="${c.id}" aria-pressed="${active ? "true" : "false"}">
              <span class="idle-char-card__avatar" aria-hidden="true">${avatar}</span>
              <span class="idle-char-card__copy">
                <span class="idle-char-card__name">${escapeHtml(c.name)}</span>
                <span class="idle-char-card__meta">${escapeHtml(classLabel(c.classId))}</span>
                <span class="idle-char-card__lv">Lv. ${c.level || 1}</span>
                ${ascentHtml}
                ${farm}
              </span>
            </button>`);
        }
        els.list.innerHTML = cards.join("");

        els.list.querySelectorAll("[data-id]").forEach((btn) => {
          btn.addEventListener("click", () => selectCharacter(btn.getAttribute("data-id")));
        });
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderDetail() {
        const c = selectedCharacter();
        if (!c) {
          els.detail.hidden = true;
          return;
        }
        els.detail.hidden = false;
        setErr(els.detailErr, "");

        const attrs = c.attributes || {};
        els.detailName.textContent = c.name;
        const ascent = ascentLabel(c);
        els.detailMeta.textContent = ascent
          ? `Lv. ${c.level || 1} · ${classLabel(c.classId)} · ${ascent}`
          : `Lv. ${c.level || 1} · ${classLabel(c.classId)}`;
        els.gold.textContent = fmt(c.gold);

        els.attrGrid.innerHTML = [
          ["str", "FOR", attrs.str ?? attrs.FOR ?? 0],
          ["int", "INT", attrs.int ?? attrs.INT ?? 0],
          ["dex", "DES", attrs.dex ?? attrs.DES ?? 0],
          ["con", "CON", attrs.con ?? attrs.CON ?? 0],
        ]
          .map(
            ([key, label, val]) => `
            <div class="idle-attr-tile">
              <span class="idle-attr-tile__ico idle-attr-tile__ico--${key}">${label[0]}</span>
              <span class="idle-attr-tile__label">${label}</span>
              <span class="idle-attr-tile__value">${fmt(val)}</span>
            </div>`,
          )
          .join("");

        const inv = Array.isArray(c.inventory) ? c.inventory.length : 0;
        const invSize = c.inventorySize || 20;
        const bagUp = c.bagUpgrades || 0;
        const equipCount = c.equipment ? Object.values(c.equipment).filter(Boolean).length : 0;
        const atk = c.stats?.attack ?? "—";
        const def = c.stats?.defense ?? "—";

        els.bagEquip.innerHTML = `
          <div class="idle-stat-tile">
            <span class="idle-stat-tile__ico" aria-hidden="true">🎒</span>
            <div>
              <p class="idle-stat-tile__label">Mochila</p>
              <p class="idle-stat-tile__value">${inv}/${invSize} itens</p>
              <p class="idle-stat-tile__sub">${bagUp > 0 ? `Expansões: ${bagUp}` : "Capacidade base"}</p>
            </div>
          </div>
          <div class="idle-stat-tile">
            <span class="idle-stat-tile__ico" aria-hidden="true">⛨</span>
            <div>
              <p class="idle-stat-tile__label">Equipamento</p>
              <p class="idle-stat-tile__value">${equipCount} slots ocupados</p>
              <p class="idle-stat-tile__sub">ATK ${fmt(atk)} · DEF ${fmt(def)}</p>
            </div>
          </div>`;

        const hp = c.stats?.maxHp ?? 0;
        const mp = c.stats?.maxMp ?? 0;
        els.hpmp.innerHTML = `
          <div class="idle-stat-tile">
            <span class="idle-stat-tile__ico idle-stat-tile__ico--hp" aria-hidden="true">♥</span>
            <div>
              <p class="idle-stat-tile__label">HP máx.</p>
              <p class="idle-stat-tile__value">${fmt(hp)}</p>
            </div>
          </div>
          <div class="idle-stat-tile">
            <span class="idle-stat-tile__ico idle-stat-tile__ico--mp" aria-hidden="true">◆</span>
            <div>
              <p class="idle-stat-tile__label">MP máx.</p>
              <p class="idle-stat-tile__value">${fmt(mp)}</p>
            </div>
          </div>`;
      }

      function renderClassRail(full) {
        const rail = document.getElementById("class-rail");
        if (!rail) return;
        const list = state.classes.length
          ? state.classes
          : Object.keys(CLASS_HALLS).map((id) => ({ id, name: id, description: "" }));
        rail.innerHTML = list
          .map((cls) => {
            const hall = CLASS_HALLS[cls.id] || CLASS_HALLS.GUERREIRO;
            const locked = full ? " is-locked" : "";
            const tag = full ? "span" : "a";
            const href = full ? "" : ` href="/jogo-idle/criar.html?class=${encodeURIComponent(cls.id)}"`;
            return `<${tag} class="class-card${locked}"${href} style="--class-accent:${hall.accent};--class-glow:${hall.glow}">
              <img src="${hall.crest}" alt="" />
              <span><strong>${escapeHtml(cls.name)}</strong><small>${escapeHtml(cls.description || "")}</small></span>
            </${tag}>`;
          })
          .join("");
        const target = selectedCharacter()?.classId || list[0]?.id || "GUERREIRO";
        if (els.btnStudio && !full) {
          els.btnStudio.href = `/jogo-idle/criar.html?class=${encodeURIComponent(target)}`;
        }
      }

      function selectCharacter(id) {
        state.selectedId = id;
        renderList();
        renderDetail();
        syncPreviewFromSelection();
      }

      async function api(path, opts = {}) {
        const headers = applyCsrfHeaders(
          path,
          { method: opts.method, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } },
          document.cookie,
          location.origin,
        );
        const res = await fetch(path, {
          credentials: "same-origin",
          ...opts,
          headers,
        });
        const data = await res.json().catch(() => ({}));
        return rejectIfFailed(res, data, location);
      }

      async function loadLobby() {
        const [meta, chars] = await Promise.all([
          api("/api/jogo-idle/meta"),
          api("/api/jogo-idle/characters"),
        ]);

        state.classes = meta.classes || [];
        state.maxCharacters = meta.maxCharacters || 3;
        state.characters = Array.isArray(chars) ? chars : chars.characters || [];

        if (!state.selectedId && state.characters[0]) {
          state.selectedId = state.characters[0].id;
        }
        if (state.selectedId && !state.characters.some((c) => c.id === state.selectedId)) {
          state.selectedId = state.characters[0]?.id || null;
        }

        renderList();
        renderDetail();
        syncPreviewFromSelection();

        const full = state.characters.length >= state.maxCharacters;
        renderClassRail(full);
        if (els.btnStudio) {
          els.btnStudio.style.pointerEvents = full ? "none" : "auto";
          els.btnStudio.setAttribute("aria-disabled", full ? "true" : "false");
        }
        els.create.style.opacity = full ? "0.55" : "1";
        if (full) setErr(els.createErr, "Limite de personagens atingido.");
        else setErr(els.createErr, "");
      }

      els.btnPlay.addEventListener("click", async () => {
        const c = selectedCharacter();
        if (!c) return;
        setErr(els.detailErr, "");
        try {
          await api(`/api/jogo-idle/characters/${c.id}/select`, { method: "POST", body: "{}" });
          window.location.href = "/jogo-idle/play.html";
        } catch (err) {
          setErr(els.detailErr, err.message);
        }
      });

      function askDelete(character) {
        const root = document.getElementById("delete-confirm");
        const msg = document.getElementById("delete-confirm-msg");
        const meta = document.getElementById("delete-confirm-meta");
        const okBtn = document.getElementById("delete-confirm-ok");
        msg.textContent = `Excluir "${character.name}"? Esta ação não pode ser desfeita.`;
        const ascent = ascentLabel(character);
        meta.textContent = ascent
          ? `Lv. ${character.level || 1} · ${classLabel(character.classId)} · ${ascent}`
          : `Lv. ${character.level || 1} · ${classLabel(character.classId)}`;
        root.hidden = false;

        return new Promise((resolve) => {
          const previously = document.activeElement;
          okBtn?.focus();

          const finish = (value) => {
            root.hidden = true;
            root.removeEventListener("click", onClick);
            document.removeEventListener("keydown", onKey);
            resolve(value);
            if (previously instanceof HTMLElement) previously.focus();
          };

          const onClick = (event) => {
            const act = event.target.closest("[data-act]")?.dataset.act;
            if (act === "ok") finish(true);
            if (act === "cancel") finish(false);
          };

          const onKey = (event) => {
            if (event.key === "Escape") {
              event.preventDefault();
              finish(false);
            } else if (event.key === "Enter") {
              event.preventDefault();
              finish(true);
            } else if (event.key === "Tab") {
              const buttons = [...root.querySelectorAll("button")];
              if (!buttons.length) return;
              const first = buttons[0];
              const last = buttons[buttons.length - 1];
              if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
              } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
              }
            }
          };

          root.addEventListener("click", onClick);
          document.addEventListener("keydown", onKey);
        });
      }

      els.btnDelete.addEventListener("click", async () => {
        const c = selectedCharacter();
        if (!c) return;
        if (!(await askDelete(c))) return;
        setErr(els.detailErr, "");
        try {
          await api(`/api/jogo-idle/characters/${c.id}`, { method: "DELETE" });
          state.selectedId = null;
          await loadLobby();
        } catch (err) {
          setErr(els.detailErr, err.message);
        }
      });

      loadLobby().catch((err) => {
        if (els.status) els.status.hidden = true;
        els.list.innerHTML = `<div class="idle-lobby-empty">${escapeHtml(err.message || "Não foi possível abrir o salão.")}</div>`;
      });
    </script>
  </body>
</html>
