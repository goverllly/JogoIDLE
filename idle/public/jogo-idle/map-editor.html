<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IDLE Map Editor</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/jogo-idle/vendor/three/three.module.js",
          "three/addons/": "/jogo-idle/vendor/three/addons/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #061323;
        font-family: system-ui, sans-serif;
      }
      #view {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hint {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 2;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(6, 19, 35, 0.88);
        border: 1px solid rgba(244, 181, 43, 0.28);
        color: #e8f0f8;
        font-size: 11px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hint">Ferramenta: Navegar — orbite o mapa sem colocar props</div>
    <script type="module" src="/jogo-idle/map-editor.js"></script>
  </body>
</html>
