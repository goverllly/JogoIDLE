<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — Jogo IDLE</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/jogo-idle/vendor/three/three.module.js",
          "three/addons/": "/jogo-idle/vendor/three/addons/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a1522;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #hint {
        /* Hint do lobby fica no chrome React; esconde o duplicado do iframe. */
        display: none;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 500 13px/1.4 "Source Sans 3", system-ui, sans-serif;
        color: rgba(138, 164, 188, 0.9);
        pointer-events: none;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="status">Carregando personagem…</div>
      <p id="hint">Arraste para girar · roda para zoom</p>
    </div>
    <script type="module" src="/jogo-idle/preview.js"></script>
  </body>
</html>
