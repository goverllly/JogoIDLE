<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="45%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#08101c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1422" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a3d"/>
      <stop offset="50%" stop-color="#121e2e"/>
      <stop offset="100%" stop-color="#0c1520"/>
    </linearGradient>
    <radialGradient id="torchGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#e07a20" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e07a20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0a1a38"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#9a7414"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- far wall -->
  <rect x="180" y="40" width="1240" height="520" fill="url(#stone)" opacity="0.95"/>
  <!-- arches -->
  <path d="M280 560 V220 Q280 80 400 80 Q520 80 520 220 V560 Z" fill="#0d1826" stroke="#2a3d55" stroke-width="3"/>
  <path d="M560 560 V200 Q560 60 800 60 Q1040 60 1040 200 V560 Z" fill="#0b1522" stroke="#2a3d55" stroke-width="3"/>
  <path d="M1080 560 V220 Q1080 80 1200 80 Q1320 80 1320 220 V560 Z" fill="#0d1826" stroke="#2a3d55" stroke-width="3"/>
  <!-- columns -->
  <g fill="#152436" stroke="#3a5168" stroke-width="2">
    <rect x="200" y="120" width="56" height="440" rx="4"/>
    <rect x="480" y="100" width="56" height="460" rx="4"/>
    <rect x="1064" y="100" width="56" height="460" rx="4"/>
    <rect x="1344" y="120" width="56" height="440" rx="4"/>
  </g>
  <g fill="url(#goldTrim)" opacity="0.7">
    <rect x="198" y="110" width="60" height="12" rx="2"/>
    <rect x="478" y="90" width="60" height="12" rx="2"/>
    <rect x="1062" y="90" width="60" height="12" rx="2"/>
    <rect x="1342" y="110" width="60" height="12" rx="2"/>
  </g>
  <!-- banners -->
  <g>
    <rect x="310" y="140" width="70" height="160" rx="2" fill="url(#banner)" stroke="#c9a227" stroke-width="2"/>
    <rect x="1220" y="140" width="70" height="160" rx="2" fill="url(#banner)" stroke="#c9a227" stroke-width="2"/>
    <circle cx="345" cy="200" r="16" fill="none" stroke="#f0d78c" stroke-width="2"/>
    <circle cx="1255" cy="200" r="16" fill="none" stroke="#f0d78c" stroke-width="2"/>
  </g>
  <!-- torch glows -->
  <circle cx="228" cy="200" r="90" fill="url(#torchGlow)"/>
  <circle cx="1372" cy="200" r="90" fill="url(#torchGlow)"/>
  <circle cx="508" cy="180" r="70" fill="url(#torchGlow)" opacity="0.7"/>
  <circle cx="1092" cy="180" r="70" fill="url(#torchGlow)" opacity="0.7"/>
  <!-- torch flames -->
  <g>
    <ellipse cx="228" cy="195" rx="8" ry="18" fill="#ffcc66"/>
    <ellipse cx="228" cy="188" rx="5" ry="10" fill="#fff3c4"/>
    <ellipse cx="1372" cy="195" rx="8" ry="18" fill="#ffcc66"/>
    <ellipse cx="1372" cy="188" rx="5" ry="10" fill="#fff3c4"/>
  </g>
  <!-- floor -->
  <path d="M0 560 L800 500 L1600 560 L1600 900 L0 900 Z" fill="url(#floor)"/>
  <path d="M0 560 L800 500 L1600 560" fill="none" stroke="#2a3d55" stroke-width="2" opacity="0.6"/>
  <g stroke="#1a2a3d" stroke-width="1" opacity="0.45">
    <path d="M200 600 L800 540 L1400 600"/>
    <path d="M120 680 L800 600 L1480 680"/>
    <path d="M40 780 L800 680 L1560 780"/>
  </g>
  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#sky)" opacity="0.15"/>
</svg>
